<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="marketing digital, cursos marketing digital, bootcamps, tecnología, inteligencia artificial, SEO, publicidad digital, ecommerce, automatización">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">

<body>

    <main>

        <section class="global-hero" id="global-hero" aria-labelledby="about-hero">

                    <div class="section-marker">
                        <span class="section-marker-dot" aria-hidden="true"></span>

                </div>

                <div class="global-hero-visual" aria-hidden="true">
                    <div class="global-hero-visual-inner">
                        
                        <img src="assets/logos/logo-triangulo-bk.png" alt="" class="global-hero-logo">

                        <span class="global-hero-orbit global-hero-orbit-1"></span>
                        <span class="global-hero-orbit global-hero-orbit-2"></span>

                        <span class="global-hero-point global-hero-point-lime"></span>

                </div>

    <div id="footer"></div>

    <script src="js/sections.js"></script>
