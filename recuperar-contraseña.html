<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Marketnus</title>

    <meta
        name="description"
        content="Recupera el acceso a tu cuenta de Marketnus y continúa aprendiendo."
    >

    <link
        rel="icon"
        type="image/png"
        href="../assets/logos/logo-triangulo.png"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="/css/recuperar-password.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-page-container">

            <!-- Volver a Marketnus -->
            <a href="registro-login.html" class="auth-back-link">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                <span>Volver a Marketnus</span>
            </a>

            <section
                class="auth-form auth-recovery"
                aria-labelledby="recovery-title"
            >

                <div class="auth-recovery-content">

                    <a href="/" class="auth-brand" aria-label="Marketnus, inicio">
                        <img
                            src="../assets/logos/logo-triangulo.png"
                            alt="Marketnus"
                        >
                    </a>

                    <div class="auth-heading">

                        <span class="auth-label">
                            Recuperación de cuenta
                        </span>

                        <h1 id="recovery-title">
                            ¿Olvidaste tu
                            <span>contraseña?</span>
                        </h1>

                        <p>
                            No te preocupes. Introduce el email asociado
                            a tu cuenta y te enviaremos un enlace para
                            que puedas crear una nueva contraseña.
                        </p>

                    </div>

                    <form
                        id="recovery-form"
                        class="auth-form-fields"
                        method="post"
                    >

                        <div class="field-wrap">

                            <label for="recovery-email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="recovery-email"
                                name="email"
                                placeholder="tu@email.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <!-- Mensajes para el usuario -->
                        <div
                            id="recovery-message"
                            class="auth-message"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></div>

                        <button
                            type="submit"
                            class="btn btn-primary auth-submit"
                        >
                            <span>Enviar enlace de recuperación</span>
                            <i
                                class="bi bi-arrow-right"
                                aria-hidden="true"
                            ></i>
                        </button>

                    </form>

                    <p class="auth-recovery-footer">
                        ¿Ya recuerdas tu contraseña?
                        <a href="registro-login.html">
                            Iniciar sesión
                        </a>
                    </p>

                </div>

            </section>

            <p class="auth-page-note">
                Tu próximo movimiento empieza aquí.
            </p>

        </div>

    </main>

    <script src="/js/recuperar-password.js" defer></script>

</body>
</html>
